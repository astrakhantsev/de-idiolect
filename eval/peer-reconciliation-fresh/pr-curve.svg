<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="760" height="466" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Peer reconciliation as a detector: precision is pinned at 1.0</text>
  <text x="24" y="54" font-size="12.5" fill="#52514e">The τ dial and the sampling draws move recall and coverage — never precision</text>

  <text x="24" y="88" font-size="13" fill="#0b0b0b" font-weight="600">Detection precision 1.00 — 0 false positives across both keys, every draw, every pre-registered τ point</text>

  <!-- grid -->
  <g stroke="#e5e4e0" stroke-width="1">
    <line x1="150" y1="115" x2="150" y2="315"/>
    <line x1="285" y1="115" x2="285" y2="315"/>
    <line x1="420" y1="115" x2="420" y2="315"/>
    <line x1="555" y1="115" x2="555" y2="315"/>
    <line x1="690" y1="115" x2="690" y2="315"/>
  </g>
  <g font-size="11" fill="#52514e" text-anchor="middle">
    <text x="150" y="332">0</text>
    <text x="285" y="332">0.25</text>
    <text x="420" y="332">0.50</text>
    <text x="555" y="332">0.75</text>
    <text x="690" y="332">1.00</text>
  </g>
  <text x="420" y="352" font-size="11.5" fill="#52514e" text-anchor="middle">detection recall over all planted matches (n = 6 per run; abstentions count as misses here)</text>

  <!-- TRAIN key-2 draw 1 (blue) -->
  <g>
    <text x="140" y="146" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">TRAIN key-2 · draw 1</text>
    <text x="140" y="161" font-size="11" fill="#52514e" text-anchor="end">coverage 90%</text>
    <line x1="330" y1="150" x2="510" y2="150" stroke="#2a78d6" stroke-width="2" opacity="0.45"/>
    <circle cx="330" cy="150" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <circle cx="510" cy="150" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <text x="330" y="134" font-size="10.5" fill="#52514e" text-anchor="middle">τ0</text>
    <text x="510" y="134" font-size="10.5" fill="#52514e" text-anchor="middle">τ1 · τ2</text>
  </g>

  <!-- TRAIN key-2 draw 2 / resample (green) -->
  <g>
    <text x="140" y="216" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">TRAIN key-2 · draw 2</text>
    <text x="140" y="231" font-size="11" fill="#52514e" text-anchor="end">coverage 100%</text>
    <line x1="510" y1="220" x2="600" y2="220" stroke="#008300" stroke-width="2" opacity="0.45"/>
    <circle cx="510" cy="220" r="6" fill="#008300" stroke="#fcfcfb" stroke-width="2"/>
    <circle cx="600" cy="220" r="6" fill="#008300" stroke="#fcfcfb" stroke-width="2"/>
    <text x="510" y="204" font-size="10.5" fill="#52514e" text-anchor="middle">τ0</text>
    <text x="600" y="204" font-size="10.5" fill="#52514e" text-anchor="middle">τ1 · τ2</text>
  </g>

  <!-- TEST key-3 sealed (magenta) -->
  <g>
    <text x="140" y="286" font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">TEST key-3 · sealed</text>
    <text x="140" y="301" font-size="11" fill="#52514e" text-anchor="end">coverage 60%</text>
    <circle cx="510" cy="290" r="6" fill="#e87ba4" stroke="#fcfcfb" stroke-width="2"/>
    <text x="510" y="274" font-size="10.5" fill="#52514e" text-anchor="middle">τ0 · τ1 · τ2</text>
  </g>

  <!-- footnotes -->
  <text x="24" y="382" font-size="11.5" fill="#52514e">Decided-only detection recall on TEST is 1.00 (tp 4 · fp 0 · tn 2 · fn 0): every uncovered pair</text>
  <text x="24" y="398" font-size="11.5" fill="#52514e">abstained or died at an artifact gate — none was misclassified.</text>
  <text x="24" y="418" font-size="11.5" fill="#52514e">Typing precision (exact relation on asserted pairs): key-2 draws 0.50 at τ0 → 0.88 at τ1/τ2;</text>
  <text x="24" y="434" font-size="11.5" fill="#52514e">TEST 1.00 (5 of 5). Points shown are the pre-registered τ family only.</text>
  <text x="24" y="454" font-size="10.5" fill="#52514e">peer-reconciliation v0.2–v0.9 + key-3 TEST · 2026-07-19 · detection per E1b (positive = assertion or escalation)</text>
</svg>
